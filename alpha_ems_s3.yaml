# =============================================================
# ALPHA HEMS: ESP32 AUTONOMICZNY RDZEŃ (Wersja Produkcyjna Plug&Play)
# Repozytorium: zxvxv/RCE_BOX/main
# =============================================================

substitutions:
  name: "alpha-ems-s3"
  friendly_name: "Alpha EMS Core"
  # UWAGA: Token zdefiniuj w lokalnym secrets.yaml jako 'github_token'
  # github_token: "github_pat_11B57H4DY0jG7qROob454d_SEXAJ09Dxi..."

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true

# ==========================================
# KONFIGURACJA SIECI (TRYB PLUG & PLAY)
# ==========================================
wifi:
  # Moduł utworzy własną sieć, jeśli nie znajdzie żadnej znanej w pamięci NVS.
  ap:
    ssid: "Alpha EMS Hotspot"
    # password: "OpcjonalneHasloDlaInstalatora"

# Aktywacja portalu przechwytującego do konfiguracji Wi-Fi przez klienta
captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

# ==========================================
# 1. SPRZĘTOWY UART I MODBUS (DEYE)
# ==========================================
uart:
  - id: modbus_uart
    tx_pin: 22
    rx_pin: 21
    baud_rate: 9600
    stop_bits: 1

modbus:
  - id: deye_modbus
    uart_id: modbus_uart
    flow_control_pin: 17

# ==========================================
# 2. POBRANIE LOGIKI Z GITHUB (Rdzeń C++)
# ==========================================
# Pobieranie zewnętrznego pliku nagłówkowego bezpośrednio z prywatnego repo
packages:
  ems_core_logic:
    url: https://${github_token}@raw.githubusercontent.com/zxvxv/RCE_BOX/main/ems_core.h
    refresh: 1h

# ==========================================
# 3. URUCHOMIENIE KOMPONENTU
# ==========================================
custom_component:
  - lambda: |-
      auto alpha_ems = new AlphaEMSCore(id(deye_modbus));
      return {alpha_ems};
